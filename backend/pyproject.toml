[project]
name = "sentinal-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pydantic>=2.8,<3.0",
  "reportlab>=4.2,<5.0",
  "matplotlib>=3.9,<4.0",
  "networkx>=3.3,<4.0",
  "boto3>=1.35,<2.0",
  "httpx>=0.27,<1.0",
  "mangum>=0.17,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
